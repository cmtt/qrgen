[package]
name = "qrgen"
version = "0.2.0"
authors = ["Matthias Thoemmes <thoemmes@gmail.com>"]
edition = "2021"
rust-version = "1.85"
description = "Renders text as QR codes on Unicode terminals or as SVG."
license = "MIT"
repository = "https://github.com/cmtt/qrgen"
readme = "README.md"
keywords = ["qr", "qrcode", "terminal", "cli", "svg"]
categories = ["command-line-utilities"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
qrcodegen = "1.8"
clap = { version = "4.6", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
codegen-units = 1
